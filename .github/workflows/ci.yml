name: Tflash checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tflash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Dummy, non-production values; the checks do not call real services.
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.test
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-key
      TFLASH_SESSION_SECRET: ci-session-secret-not-for-production-0123456789
      PROVIDER_KEYS_SECRET: ci-provider-secret-not-for-production-0123456789
      APP_URL: https://tflash.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Dependency security audit
        run: corepack pnpm run audit:security
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt" || {
            # Surface failed-test details in the check annotation as well as
            # the downloadable log, without masking the test exit status.
            python3 - "$RUNNER_TEMP/test-output.txt" <<'PYTHON'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          marker = text.rfind("✖ failing tests:")
          excerpt = text[marker:] if marker >= 0 else "\n".join(text.splitlines()[-60:])
          excerpt = excerpt[-12000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Test failure details::" + excerpt)
          PYTHON
            exit 1
          }
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Build web application
        run: corepack pnpm build
      - name: Build Eve agent
        run: corepack pnpm build:eve
      # Verify actual compiled-runtime fix; reject missing/tampered backports.
      - name: Bundled Zod release gate
        run: corepack pnpm run audit:bundled-zod
